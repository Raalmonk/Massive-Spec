<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: 铺满刘海屏整块屏幕, 再用 env(safe-area-inset-*) 把内容让开
         刘海/圆角/底部 home 条 (见下方 .app-shell 与 .nav-safe-top) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>M-Spec</title>
    <!-- 站点图标: 魔兽武僧「神龙裂空斩」(Whirling Dragon Punch) -->
    <link rel="icon" type="image/jpeg" href="images/brand/wdp.jpg">
    <link rel="apple-touch-icon" href="images/brand/wdp.jpg">

    <!-- 1. Precompiled Tailwind CSS (built by scripts/build_frontend.py) -->
    <link rel="stylesheet" href="dist/app.css?v=7edd41aae1">

    <!-- 2. Precompiled React App (source: front_end/src/app.jsx, built by scripts/build_frontend.py) -->
    <!-- 注: api.js 的 loadRanking 从未被时间轴引用 (fetchRankings 自带实现), 故不再加载 -->
    <script defer src="dist/app.js?v=d5d20072b5"></script>

    <style>
        /* Scrollbar Styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 12px;
            height: 12px;
            background: #121212;
        }
        .custom-scrollbar::-webkit-scrollbar-corner {
            background: #121212;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border: 3px solid #121212;
            border-radius: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #00FF96;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            margin: 0; overflow: hidden; background-color: #121212; user-select: none;
            /* 与首页同一套字体栈 (Inter 自托管, @font-face 在编译出的共享样式表里) */
            font-family: Inter, system-ui, -apple-system, "Segoe UI", "PingFang SC",
                "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei", "Malgun Gothic", sans-serif;
        }

        /* 应用外壳高度: 移动端浏览器的 100vh 包含地址栏占用的区域, 会把底部内容顶出屏幕;
           dvh 是随地址栏收放变化的实际可视高度 (不支持的老浏览器回落到 vh) */
        .app-shell {
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box;
            /* 刘海屏安全区: 竖屏时刘海在上方(由 .nav-safe-top 处理, 让导航底色铺满那一条),
               横屏时刘海在左或右 —— 横屏正是看时间轴的主要姿势, 不让开会挡住左侧排名列;
               底部 home 指示条同理, 否则会盖住最后一行和横向滚动条 */
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        /* 导航条把刘海那一条也涂成自己的底色, 视觉上连成一片, 而不是露出一条黑边 */
        .nav-safe-top { padding-top: env(safe-area-inset-top, 0px); }
        img, svg {
            -webkit-user-drag: none;
            user-drag: none;
            user-select: none;
        }

        /* Custom Drag Cursor */
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }

        /* Sticky 左面板的右侧阴影: 用线性渐变伪元素替代模糊 box-shadow。
           拖动时 100+ 个 sticky 单元格每帧都要合成, 渐变比模糊便宜得多 */
        .left-cell-shadow::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            right: -6px;
            width: 6px;
            background: linear-gradient(to right, rgba(0,0,0,0.4), rgba(0,0,0,0));
            pointer-events: none;
        }
        .nav-select {
            color-scheme: dark;
        }
        .nav-select option {
            background-color: #111111;
            color: #f3f4f6;
        }
        
        /* Input Number Styling - Remove spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        
        /* Animation for Selection Mode */
        @keyframes pulse-border-blue {
            0% { border-color: #3B82F6; }
            50% { border-color: rgba(59, 130, 246, 0.2); }
            100% { border-color: #3B82F6; }
        }
        .selection-active-blue {
            animation: pulse-border-blue 2s infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

</body>
</html>
